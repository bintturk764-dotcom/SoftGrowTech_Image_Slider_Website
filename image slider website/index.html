<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Advanced Image Slider</title>
  <style>
    :root {
      --bg: rgb(214, 194, 214);
      --text: #000;
    }

    body.dark {
      --bg: #222020;
      --text: #fff;
    }

    body {
      margin: 0;
      font-family: 'Times New Roman', Times, serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    .slider {
      position: relative;
      width: 80%;
      max-width: 700px;
      border-radius: 35px;
      overflow: hidden;
    }

    .slides {
      position: relative;
      height: 350px;
    }

    .slide {
      position: absolute;
      width: 100%;
      height: 100%;
      opacity: 0;
      transition: opacity 1s;
    }

    .slide.active {
      opacity: 1;
    }

    img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .caption {
      position: absolute;
      bottom: 20px;
      left: 20px;
      background: rgba(0, 0, 0, 0.5);
      color: #fff;
      padding: 10px 20px;
      border-radius: 10px;
    }

    .btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(0, 0, 0, 0.5);
      color: white;
      border: 20;
      padding: 15px;
      cursor: pointer;
      border-radius: 50%;
    }

    .prev {
      left: 10px;
    }

    .next {
      right: 10px;
    }

    .dots {
      text-align: center;
      margin-top: 10px;
    }

    .dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      margin: 5px;
      border-radius: 50%;
      background: gray;
      cursor: pointer;
    }

    .active-dot {
      background: black;
    }

    .thumbnails {
      display: flex;
      justify-content: center;
      margin-top: 10px;
    }

    .thumbnails img {
      width: 60px;
      height: 40px;
      margin: 5px;
      cursor: pointer;
      opacity: 0.6;
    }

    .thumbnails img.active-thumb {
      border: 2px solid rgb(0, 0, 5);
      opacity: 1;
    }

    .theme-toggle {
      cursor: pointer;
      font-size: 2.0rem;
      margin-bottom: 8%;
      transition-delay: 3ms;
      position: absolute;
      right: 0;
      top: 0;
      margin-top: 5%;
    }

    .theme-toggle:hover {
      background: rgba(0, 0, 0, 0.1);
    }

    .hovering {
      text-align: center;
      position: absolute;
      top: 6%;
    }
  </style>
</head>

<body>

  <span class="theme-toggle" onclick="toggleTheme()">🌓</span>

  <div class="slider" id="slider">
    <div class="slides">

      <div class="slide active"><img src="c3.webp">
        <div class="caption">Cherry blossom</div>
      </div>
      <div class="slide"><img src="c5.webp">
        <div class="caption">Cherry blossom art</div>
      </div>
      <div class="slide"><img src="c6.webp">
        <div class="caption">Sunset in cherry season</div>
      </div>
      <div class="slide"><img src="OIP.webp">
        <div class="caption">Mounatin with cherry blossom</div>
      </div>

    </div>

    <button class="btn prev" onclick="prevSlide()">❮</button>
    <button class="btn next" onclick="nextSlide()">❯</button>
  </div>

  <div class="dots" id="dots"></div>
  <div class="thumbnails" id="thumbs"></div>
  <p class="hovering">ℹ️Hover to pause slideshow</p>

  <script>
    let index = 0;
    const slides = document.getElementsByClassName("slide");
    const dotsContainer = document.getElementById("dots");
    const thumbsContainer = document.getElementById("thumbs");
    const slider = document.getElementById("slider");
    let startX = 0;
    let interval;

    // dots + thumbnails
    for (let i = 0; i < slides.length; i++) {
      let dot = document.createElement("span");
      dot.className = "dot";
      dot.onclick = () => showSlide(i);
      dotsContainer.appendChild(dot);

      let img = slides[i].querySelector("img").src;
      let thumb = document.createElement("img");
      thumb.src = img;
      thumb.onclick = () => showSlide(i);
      thumbsContainer.appendChild(thumb);
    }

    const dots = document.getElementsByClassName("dot");
    const thumbs = document.getElementById("thumbs").children;

    function updateUI() {
      for (let s of slides) s.classList.remove("active");
      for (let d of dots) d.classList.remove("active-dot");
      for (let t of thumbs) t.classList.remove("active-thumb");

      slides[index].classList.add("active");
      dots[index].classList.add("active-dot");
      thumbs[index].classList.add("active-thumb");
    }

    function showSlide(i) {
      index = (i + slides.length) % slides.length;
      updateUI();
    }

    function nextSlide() { showSlide(index + 1); }
    function prevSlide() { showSlide(index - 1); }

    function startAuto() { interval = setInterval(nextSlide, 3000); }
    function stopAuto() { clearInterval(interval); }

    slider.addEventListener("mouseenter", stopAuto);
    slider.addEventListener("mouseleave", startAuto);

    window.addEventListener("keydown", e => {
      if (e.key === "ArrowRight") nextSlide();
      if (e.key === "ArrowLeft") prevSlide();
    });

    afterTouchStart = (e) => startX = e.touches[0].clientX;
    afterTouchEnd = (e) => {
      let endX = e.changedTouches[0].clientX;
      if (startX - endX > 50) nextSlide();
      if (endX - startX > 50) prevSlide();
    };
    slider.addEventListener("touchstart", afterTouchStart);
    slider.addEventListener("touchend", afterTouchEnd);

    function toggleTheme() {
      document.body.classList.toggle("dark");
    }

    showSlide(index);
    startAuto();
  </script>

</body>

</html>
